name: Daily price refresh

on:
  schedule:
    - cron: "30 4 * * *"   # 04:30 UTC = 07:30 שעון ישראל
  workflow_dispatch: {}      # allows manual "Run workflow" button

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download today's prices and rebuild the app
        working-directory: pipeline
        run: node update.js

      - name: Commit updated app
        run: |
          git config user.name "wolf-price-bot"
          git config user.email "actions@github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No price changes today"
          else
            git commit -m "עדכון מחירים יומי $(date +%d.%m.%Y)"
            git push
          fi
