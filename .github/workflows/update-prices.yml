name: Daily price refresh

# NOTE: the Israeli chains' price servers block non-Israeli IPs, so this
# workflow CANNOT run on GitHub's cloud runners (only Shufersal succeeds).
# The daily refresh runs locally on the owner's machine (Claude scheduled task
# "wolf-shopping-price-refresh") and pushes here. Kept for manual retries only.
on:
  workflow_dispatch: {}      # manual "Run workflow" button only

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download today's prices and rebuild the app
        working-directory: pipeline
        run: node update.js

      - name: Commit updated app
        run: |
          git config user.name "wolf-price-bot"
          git config user.email "actions@github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No price changes today"
          else
            git commit -m "עדכון מחירים יומי $(date +%d.%m.%Y)"
            git push
          fi
